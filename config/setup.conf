# agents-setup: declarative source of truth.
#
# After editing this file, converge the system (as root):
#
#     bin/provision-agents provision --all
#
# Re-running is idempotent: it adds what is missing, updates what drifted,
# and revokes anything no longer listed here.

[setup]

# Unix group shared by humans and agents. Provisioning FULLY OWNS the
# supplementary membership of this group: accounts not listed under
# [humans] or [agents] are removed from it. Do not use it to grant
# unrelated access.
shared_group = agents

# Root-owned state directory (provisioning lock, per-agent records).
state_dir = /var/lib/nix-agents

# Root-owned directory holding the generated wrappers. This directory is
# prepended to every human's PATH. Because only root can write here,
# vendor self-updaters (e.g. Claude Code updating itself) can NEVER
# overwrite the wrappers -- they replace the real binary elsewhere and
# the wrapper picks up the new binary automatically at runtime.
shim_dir = /usr/local/lib/agent-shims/bin

# PATH used (by provisioning AND by the wrappers at runtime) to locate
# the real binaries behind the wrappers. The shim_dir is always skipped.
target_path = /usr/local/bin:/usr/local/games:/usr/bin:/usr/games:/opt/bin

# Put shim_dir first in PATH via a managed block appended to each
# human's ~/.bashrc / ~/.profile (appended so it beats ~/.local/bin added
# later in the file). Set to false to maintain PATH yourself.
manage_human_path = true

# Generated doas rules do not prompt for the human's password.
# Do NOT enable `keepenv` anywhere in doas.conf; see README.
nopass = true

[humans]
members =
    andee

[agents]
# agent-account-name = command the account runs.
# Each agent also gets a managed block with operating instructions in
# the tool's user-level instruction file (claude -> ~/.claude/CLAUDE.md,
# codex -> ~/.codex/AGENTS.md, anything else -> ~/AGENTS.md), rendered
# from agent/AGENT.md.template. Override per agent with
#     [agent.NAME]
#     doc = relative/path.md      (or: doc = none)
# The command must exist in target_path (it may be installed later; the
# wrapper resolves it at runtime and provisioning only warns if absent).
claude = claude
